    {
      "name": "ST: startup and reset require healthy contacts and clear sensors",
      "steps": [
        {
          "scans": 1,
          "expect": {
            "MainStep": 1,
            "Mode": 0,
            "Belt1SpeedMps": 0.0
          }
        },
        {
          "given": {
            "EmergencyStop": true,
            "EmergencyStop2": true,
            "Stop": true,
            "AtExit": true,
            "RejPushBackLimit": true,
            "LidPusherRetracted": true,
            "BasePusherRetracted": true,
            "RawPusherRetracted": true
          },
          "scans": 1,
          "expect": {
            "MainStep": 2
          }
        },
        {
          "given": {
            "Reset": true,
            "ClassifyDefuseSensor": true
          },
          "scans": 1,
          "expect": {
            "MainStep": 2
          }
        },
        {
          "given": {
            "ClassifyDefuseSensor": false
          },
          "scans": 1,
          "expect": {
            "MainStep": 3
          }
        },
        {
          "given": {
            "EmergencyStop2": false
          },
          "scans": 1,
          "expect": {
            "MainStep": 1,
            "Mode": 0
          }
        }
      ],
      "given": {
        "LanguageSelect": 1
      }
    },
    {
